<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Credits — Colin Chow</title>
  <link rel="icon" type="image/png" href="yuh.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-x: hidden; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #000;
    }

    /* ── NAV (identical to index.html) ── */
    nav {
      font-family: 'IBM Plex Mono', monospace;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 44px;
      background: transparent;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: flex-start;
      padding: 22px 32px 0;
      transition: opacity 0.4s ease;
    }
    nav.nav-hidden { opacity: 0; pointer-events: none; }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }
    .nav-left a {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #000;
      padding: 0;
      text-decoration: none;
      transition: opacity 0.2s;
      font-family: 'IBM Plex Mono', monospace;
    }
    .nav-left a:hover { font-weight: 700; }

    .nav-brand {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -14px;
    }
    .nav-brand img {
      height: 84px;
      width: auto;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }
    .nav-location {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #000;
      font-family: 'IBM Plex Mono', monospace;
    }
    .nav-location-icon {
      width: 12px;
      height: 12px;
      border: 1px solid #000;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .nav-location-icon::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #000;
    }
    .nav-clock {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      font-variant-numeric: tabular-nums;
      color: #000;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      justify-self: end;
    }
    .hamburger span { display: block; width: 20px; height: 1px; background: #000; }

    /* mobile overlay */
    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .mobile-menu.open { display: flex; }
    .mobile-close {
      position: absolute;
      top: 10px; right: 24px;
      background: none;
      border: none;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
    }
    .mobile-menu a {
      background: none;
      border: none;
      color: #fff;
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── CREDITS ── */
    .credits-header { padding: 130px 40px 0; }
    .credits-page-title {
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: normal;
      color: #1c1c1c;
      font-size: clamp(2.4rem, 6.4vw, 7.2vw);
      margin-bottom: 64px;
    }

    .credits-list { padding: 0 40px 80px; }

    .credit-project {
      border-top: 1px solid #000;
      padding: 28px 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: start;
    }
    .credit-project:last-child { border-bottom: 1px solid #000; }

    .credit-left {}
    .credit-project-title {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-transform: lowercase;
      margin-bottom: 10px;
    }
    .credit-roles {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
    }
    .credit-role {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .credit-role::before { content: '— '; }

    .credit-right { text-align: right; }
    .credit-year {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      opacity: 0.4;
    }
    .credit-category {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.3;
      margin-top: 4px;
    }

    /* ── FOOTER ── */
    footer { margin-top: 96px; padding: 0 40px 56px; }
    footer hr { border: none; border-top: 1px solid #000; margin-bottom: 32px; }
    .footer-row { display: flex; align-items: center; justify-content: space-between; }
    .footer-name { font-size: 11px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; }
    .footer-links { display: flex; gap: 32px; list-style: none; }
    .footer-links a {
      color: #000;
      text-decoration: none;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .footer-links a:hover { opacity: 0.4; }

    /* ── MOBILE ── */
    @media (max-width: 900px) {
      nav { padding: 22px 24px 0; }
      .nav-left { display: none; }
      .nav-right { display: none; }
      .hamburger { display: flex; }
      .credits-header { padding: 96px 24px 0; }
      .credits-list   { padding: 0 24px 64px; }
      .credit-project { grid-template-columns: 1fr; gap: 8px; }
      .credit-right   { text-align: left; }
      .credit-project-title { font-size: 22px; }
      footer  { padding: 0 24px 40px; margin-top: 64px; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <ul class="nav-left">
    <li><a href="/home">Work</a></li>
    <li><a href="/home#about">About</a></li>
    <li><a href="/credits">Credits</a></li>
  </ul>

  <a href="/home" class="nav-brand"><img src="yuh.png" alt="Colin Chow"></a>

  <div class="nav-right">
    <span class="nav-location">
      <span class="nav-location-icon"></span>
      Based in New York
    </span>
    <span class="nav-clock" id="navClock"></span>
  </div>

  <button class="hamburger" onclick="openMenu()" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- ── MOBILE MENU ── -->
<div class="mobile-menu" id="mobileMenu">
  <button class="mobile-close" onclick="closeMenu()" aria-label="Close">×</button>
  <a href="/home"        onclick="closeMenu()">Work</a>
  <a href="/home#about"  onclick="closeMenu()">About</a>
  <a href="/credits"     onclick="closeMenu()">Credits</a>
</div>

<!-- ── CREDITS CONTENT ── -->
<div class="credits-header">
  <h1 class="credits-page-title">Film<br>Credits</h1>
</div>
<div class="credits-list" id="creditsList"></div>

<footer id="contact">
  <hr>
  <div class="footer-row">
    <span class="footer-name">Colin Chow</span>
    <ul class="footer-links">
      <li><a href="https://www.instagram.com/colchow_/" target="_blank" rel="noopener">Instagram</a></li>
      <li><a href="https://www.linkedin.com/in/colin-chow-7a4744281/" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
  </div>
</footer>

<script>
  // ── LIVE CLOCK ──
  function updateClock() {
    var now  = new Date();
    var h    = now.getHours();
    var m    = now.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('navClock').textContent =
      h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── MOBILE MENU ──
  function openMenu()  { document.getElementById('mobileMenu').classList.add('open');    document.body.style.overflow = 'hidden'; }
  function closeMenu() { document.getElementById('mobileMenu').classList.remove('open'); document.body.style.overflow = ''; }

  // ── SMART NAV (hide on scroll down, show on scroll up) ──
  (function () {
    var nav   = document.querySelector('nav');
    var lastY = 0;
    window.addEventListener('scroll', function () {
      var y = window.scrollY;
      if (y > lastY && y > 80) {
        nav.classList.add('nav-hidden');
      } else {
        nav.classList.remove('nav-hidden');
      }
      lastY = y;
    }, { passive: true });
  })();

  // ── CREDITS DATA ──
  var filmCredits = [
    {
      title:    'Two Man',
      year:     2025,
      category: 'Narrative',
      roles:    ['Director', 'Director of Photography'],
    },
    {
      title:    'TVB Music Video',
      year:     2026,
      category: 'Music Video',
      roles:    ['Director', 'Director of Photography', 'Editor'],
    },
    {
      title:    'Tally',
      year:     2026,
      category: 'Short Film',
      roles:    ['Director', 'Director of Photography', 'Editor'],
    },
    {
      title:    'Left Behind',
      year:     2026,
      category: 'Short Film',
      roles:    ['Director of Photography', 'Colorist'],
    },
    {
      title:    'Is This Okay?',
      year:     2026,
      category: 'Narrative',
      roles:    ['Director of Photography', 'Production Assistant'],
    },
    {
      title:    'American Standard',
      year:     '2025–2026',
      category: 'TV Series',
      roles:    ['Campaign Photographer', 'Grip', 'Production Assistant'],
    },
    {
      title:    'Halo',
      year:     2026,
      category: 'Dance Film',
      roles:    ['Campaign Photographer'],
    },
    {
      title:    'Done Time',
      year:     2025,
      category: 'Dance Film',
      roles:    ['Campaign Photographer'],
    },
    {
      title:    'Ruin',
      year:     2026,
      category: 'Short Film',
      roles:    ['Key Grip'],
    },
  ];

  // ── BUILD CREDITS LIST ──
  var creditsList = document.getElementById('creditsList');

  filmCredits.forEach(function(c) {
    var rolesHtml = c.roles.map(function(r) {
      return '<span class="credit-role">' + r + '</span>';
    }).join('');

    var item = document.createElement('div');
    item.className = 'credit-project';
    item.innerHTML =
      '<div class="credit-left">' +
        '<p class="credit-project-title">' + c.title + '</p>' +
        '<div class="credit-roles">' + rolesHtml + '</div>' +
      '</div>' +
      '<div class="credit-right">' +
        '<p class="credit-year">' + c.year + '</p>' +
        '<p class="credit-category">' + c.category + '</p>' +
      '</div>';

    creditsList.appendChild(item);
  });
</script>
</body>
</html>
