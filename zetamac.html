<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arithmetic Game</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Helvetica, Arial, sans-serif;
    background: #fff;
    color: #000;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  main { width: 100%; max-width: 480px; }
  h1 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 32px;
  }

  /* ── SETTINGS SCREEN ── */
  .op-row { margin-bottom: 18px; font-size: 14px; }
  .op-check { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-bottom: 6px; }
  .op-check input[type="checkbox"] { width: 15px; height: 15px; }
  .op-detail { padding-left: 23px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .op-detail-static { padding-left: 23px; color: #777; }
  .op-detail input[type="number"] {
    width: 56px;
    font-size: 14px;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }
  .op-detail .to, .op-detail .sym { color: #777; }

  .time-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    margin: 24px 0 28px;
  }
  .time-row select {
    font-size: 14px;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 0;
    width: 100%;
    cursor: pointer;
  }
  button:hover { opacity: 0.85; }

  /* ── GAME SCREEN ── */
  .hud {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .problem {
    font-size: 34px;
    font-weight: 500;
    text-align: center;
    margin-bottom: 24px;
    letter-spacing: 0.02em;
  }
  .answer-input {
    display: block;
    width: 100%;
    font-size: 24px;
    text-align: center;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    margin-bottom: 28px;
  }
  .answer-input:focus { outline: 2px solid #000; }
  .history {
    font-size: 12px;
    color: #888;
    line-height: 1.8;
    text-align: center;
    max-height: 160px;
    overflow-y: auto;
  }

  /* ── END SCREEN ── */
  .end-score {
    font-size: 40px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
  }
  .end-label {
    font-size: 14px;
    color: #888;
    text-align: center;
    margin-bottom: 28px;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<main>
  <h1>Arithmetic Game</h1>

  <!-- ── SETTINGS ── -->
  <section id="settingsScreen">
    <div class="op-row">
      <label class="op-check"><input type="checkbox" id="enableAdd" checked> Addition</label>
      <div class="op-detail">
        Range: (<input type="number" id="addMin1" value="2"> <span class="to">to</span> <input type="number" id="addMax1" value="100">) + (<input type="number" id="addMin2" value="2"> <span class="to">to</span> <input type="number" id="addMax2" value="100">)
      </div>
    </div>

    <div class="op-row">
      <label class="op-check"><input type="checkbox" id="enableSub" checked> Subtraction</label>
      <div class="op-detail-static">Addition problems in reverse.</div>
    </div>

    <div class="op-row">
      <label class="op-check"><input type="checkbox" id="enableMul" checked> Multiplication</label>
      <div class="op-detail">
        Range: (<input type="number" id="mulMin1" value="2"> <span class="to">to</span> <input type="number" id="mulMax1" value="12">) &times; (<input type="number" id="mulMin2" value="2"> <span class="to">to</span> <input type="number" id="mulMax2" value="100">)
      </div>
    </div>

    <div class="op-row">
      <label class="op-check"><input type="checkbox" id="enableDiv" checked> Division</label>
      <div class="op-detail-static">Multiplication problems in reverse.</div>
    </div>

    <div class="time-row">
      <label for="timeLimit">Duration:</label>
      <select id="timeLimit">
        <option value="30">30 seconds</option>
        <option value="60">60 seconds</option>
        <option value="120" selected>120 seconds</option>
        <option value="300">300 seconds</option>
      </select>
    </div>

    <button id="startBtn">Start</button>
  </section>

  <!-- ── GAME ── -->
  <section id="gameScreen" class="hidden">
    <div class="hud">
      <span id="scoreDisplay">Score: 0</span>
      <span id="timeDisplay">Seconds left: 120</span>
    </div>
    <div class="problem" id="problemDisplay"></div>
    <input type="text" id="answerInput" class="answer-input" inputmode="numeric" autocomplete="off">
    <div class="history" id="historyDisplay"></div>
  </section>

  <!-- ── END ── -->
  <section id="endScreen" class="hidden">
    <div class="end-score" id="finalScore">0</div>
    <div class="end-label">problems solved</div>
    <button id="playAgainBtn">Play again</button>
  </section>
</main>

<script>
(function () {
  var settingsScreen = document.getElementById('settingsScreen');
  var gameScreen      = document.getElementById('gameScreen');
  var endScreen       = document.getElementById('endScreen');

  var scoreDisplay    = document.getElementById('scoreDisplay');
  var timeDisplay     = document.getElementById('timeDisplay');
  var problemDisplay  = document.getElementById('problemDisplay');
  var answerInput     = document.getElementById('answerInput');
  var historyDisplay  = document.getElementById('historyDisplay');
  var finalScore      = document.getElementById('finalScore');

  var score = 0;
  var timerId = null;
  var current = null; // { text, answer }
  var settings = null;

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function readSettings() {
    return {
      time: parseInt(document.getElementById('timeLimit').value, 10),
      addEnabled: document.getElementById('enableAdd').checked,
      subEnabled: document.getElementById('enableSub').checked,
      mulEnabled: document.getElementById('enableMul').checked,
      divEnabled: document.getElementById('enableDiv').checked,
      addMin1: parseInt(document.getElementById('addMin1').value, 10),
      addMax1: parseInt(document.getElementById('addMax1').value, 10),
      addMin2: parseInt(document.getElementById('addMin2').value, 10),
      addMax2: parseInt(document.getElementById('addMax2').value, 10),
      mulMin1: parseInt(document.getElementById('mulMin1').value, 10),
      mulMax1: parseInt(document.getElementById('mulMax1').value, 10),
      mulMin2: parseInt(document.getElementById('mulMin2').value, 10),
      mulMax2: parseInt(document.getElementById('mulMax2').value, 10)
    };
  }

  // Ported directly from zetamac's own /dist/app.js (pg_add/pg_sub/pg_mul/pg_div):
  // subtraction always subtracts the *first* addend back off the sum (never
  // the second), and division's divisor always comes from the mul-left range
  // while the answer comes from mul-right — neither is randomly flipped.
  function pg_add(settings) {
    var left  = randInt(settings.addMin1, settings.addMax1);
    var right = randInt(settings.addMin2, settings.addMax2);
    return { text: left + ' + ' + right, answer: left + right };
  }
  function pg_sub(settings) {
    var first  = randInt(settings.addMin1, settings.addMax1);
    var second = randInt(settings.addMin2, settings.addMax2);
    var left  = first + second;
    var right = first;
    return { text: left + ' − ' + right, answer: left - right };
  }
  function pg_mul(settings) {
    var left  = randInt(settings.mulMin1, settings.mulMax1);
    var right = randInt(settings.mulMin2, settings.mulMax2);
    return { text: left + ' × ' + right, answer: left * right };
  }
  function pg_div(settings) {
    var first  = randInt(settings.mulMin1, settings.mulMax1);
    var second = randInt(settings.mulMin2, settings.mulMax2);
    if (first === 0) return null; // avoid divide-by-zero if 0 is in range
    var left  = first * second;
    var right = first;
    return { text: left + ' ÷ ' + right, answer: left / right };
  }

  function nextProblem(settings) {
    var pgs = [];
    if (settings.addEnabled) pgs.push(pg_add);
    if (settings.subEnabled) pgs.push(pg_sub);
    if (settings.mulEnabled) pgs.push(pg_mul);
    if (settings.divEnabled) pgs.push(pg_div);

    var result = null;
    while (result == null) {
      result = pgs[randInt(0, pgs.length - 1)](settings);
    }

    current = { text: result.text, answer: result.answer };
    problemDisplay.textContent = result.text + ' =';
  }

  function startGame() {
    settings = readSettings();
    if (!settings.addEnabled && !settings.subEnabled && !settings.mulEnabled && !settings.divEnabled) {
      alert('Enable at least one operation.');
      return;
    }

    score = 0;
    historyDisplay.innerHTML = '';
    scoreDisplay.textContent = 'Score: 0';
    timeDisplay.textContent  = 'Seconds left: ' + settings.time;

    settingsScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');

    nextProblem(settings);
    answerInput.value = '';
    answerInput.focus();

    var startTime = Date.now();
    clearInterval(timerId);
    timerId = setInterval(function () {
      var secondsLeft = settings.time - Math.floor((Date.now() - startTime) / 1000);
      timeDisplay.textContent = 'Seconds left: ' + secondsLeft;
      if (secondsLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    clearInterval(timerId);
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
    finalScore.textContent = score;
  }

  answerInput.addEventListener('input', function () {
    if (answerInput.value.trim() === String(current.answer)) {
      score++;
      scoreDisplay.textContent = 'Score: ' + score;

      var line = document.createElement('div');
      line.textContent = current.text + ' = ' + current.answer;
      historyDisplay.insertBefore(line, historyDisplay.firstChild);

      answerInput.value = '';
      nextProblem(settings);
    }
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('playAgainBtn').addEventListener('click', function () {
    endScreen.classList.add('hidden');
    settingsScreen.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
