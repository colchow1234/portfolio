<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Films — Colin Chow</title>
  <link rel="icon" type="image/png" href="yuh.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-x: hidden; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #000;
    }

    /* ── NAV (identical to index.html) ── */
    nav {
      font-family: 'IBM Plex Mono', monospace;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 44px;
      background: transparent;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: flex-start;
      padding: 22px 32px 0;
      transition: opacity 0.4s ease;
    }
    nav.nav-hidden { opacity: 0; pointer-events: none; }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }
    .nav-left a {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #000;
      padding: 0;
      text-decoration: none;
      transition: opacity 0.2s;
      font-family: 'IBM Plex Mono', monospace;
    }
    .nav-left a:hover { font-weight: 700; }

    .nav-brand {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -14px;
    }
    .nav-brand img {
      height: 84px;
      width: auto;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }
    .nav-location {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #000;
      font-family: 'IBM Plex Mono', monospace;
    }
    .nav-location-icon {
      width: 12px;
      height: 12px;
      border: 1px solid #000;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .nav-location-icon::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #000;
    }
    .nav-clock {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      font-variant-numeric: tabular-nums;
      color: #000;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      justify-self: end;
    }
    .hamburger span { display: block; width: 20px; height: 1px; background: #000; }

    /* mobile overlay */
    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .mobile-menu.open { display: flex; }
    .mobile-close {
      position: absolute;
      top: 10px; right: 24px;
      background: none;
      border: none;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
    }
    .mobile-menu a {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── PAGE HEADER (identical to Credits page title) ── */
    .films-header { padding: 84px 40px 0; }
    .films-page-title {
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #1c1c1c;
      font-size: clamp(1.6rem, 4vw, 4.5rem);
      margin-bottom: 32px;
    }

    /* ── GALLERY (identical to Featured Work grid) ── */
    #film-work { padding: 0 40px 100px; }
    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .card-wrap { }
    .project-card {
      display: block;
      width: 100%;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      text-decoration: none;
    }
    .card-inner {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.35s ease;
    }
    .project-card:hover .card-inner { transform: scale(1.03); }
    .card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-fade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #000;
      opacity: 0;
      transition: opacity 300ms ease-out;
      pointer-events: none;
    }
    .project-card:hover .card-fade { opacity: 0.25; }
    .card-ghost {
      color: #fff;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.22;
      user-select: none;
      pointer-events: none;
    }

    /* ── FOOTER ── */
    footer { margin-top: 96px; padding: 0 40px 56px; }
    footer hr { border: none; border-top: 1px solid #000; margin-bottom: 32px; }
    .footer-row { display: flex; align-items: center; justify-content: space-between; }
    .footer-name { font-size: 11px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; }
    .footer-links { display: flex; gap: 32px; list-style: none; }
    .footer-links a {
      color: #000;
      text-decoration: none;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .footer-links a:hover { opacity: 0.4; }


    /* ── MOBILE ── */
    @media (max-width: 900px) {
      nav { grid-template-columns: 1fr auto; padding: 22px 24px 0; }
      .nav-left { display: none; }
      .nav-brand { text-align: left; }
      .nav-right { display: none; }
      .hamburger { display: flex; }
      .films-header { padding: 76px 24px 0; }
      #film-work { padding: 0 24px 60px; }
      .work-grid { grid-template-columns: 1fr; }
      footer  { padding: 0 24px 40px; margin-top: 64px; }
    }
  </style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <ul class="nav-left">
    <li><a href="/home">Work</a></li>
    <li><a href="/home#about">About</a></li>
    <li><a href="/credits">Credits</a></li>
    <li><a href="/sketchbook">Sketchbook</a></li>
  </ul>

  <a href="/home" class="nav-brand"><img src="yuh.png" alt="Colin Chow"></a>

  <div class="nav-right">
    <span class="nav-location">
      <span class="nav-location-icon"></span>
      Based in New York
    </span>
    <span class="nav-clock" id="navClock"></span>
  </div>

  <button class="hamburger" onclick="openMenu()" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- ── MOBILE MENU ── -->
<div class="mobile-menu" id="mobileMenu">
  <button class="mobile-close" onclick="closeMenu()" aria-label="Close">×</button>
  <a href="/credits"     onclick="closeMenu()">Credits</a>
  <a href="films.html"     onclick="closeMenu()">Films</a>
  <a href="marketing.html" onclick="closeMenu()">Marketing</a>
  <a href="photos.html"    onclick="closeMenu()">Photos</a>
  <a href="/sketchbook"  onclick="closeMenu()">Sketchbook</a>
</div>

<!-- ── FILMS CONTENT ── -->
<div class="films-header">
  <h1 class="films-page-title">Films</h1>
</div>

<div id="film-work">
  <div class="work-grid" id="filmWorkGrid"></div>
</div>

<footer id="contact">
  <hr>
  <div class="footer-row">
    <span class="footer-name">Colin Chow</span>
    <ul class="footer-links">
      <li><a href="https://www.instagram.com/colchow_/" target="_blank" rel="noopener">Instagram</a></li>
      <li><a href="https://www.linkedin.com/in/colin-chow-7a4744281/" target="_blank" rel="noopener">LinkedIn</a></li>
    </ul>
  </div>
</footer>

<script>
  // ── LIVE CLOCK ──
  function updateClock() {
    var now  = new Date();
    var h    = now.getHours();
    var m    = now.getMinutes();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    document.getElementById('navClock').textContent =
      h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── MOBILE MENU ──
  function openMenu()  { document.getElementById('mobileMenu').classList.add('open');    document.body.style.overflow = 'hidden'; }
  function closeMenu() { document.getElementById('mobileMenu').classList.remove('open'); document.body.style.overflow = ''; }

  // ── SMART NAV (hide on scroll down, show on scroll up) ──
  (function () {
    var nav   = document.querySelector('nav');
    var lastY = 0;
    window.addEventListener('scroll', function () {
      var y = window.scrollY;
      if (y > lastY && y > 80) {
        nav.classList.add('nav-hidden');
      } else {
        nav.classList.remove('nav-hidden');
      }
      lastY = y;
    }, { passive: true });
  })();

  // ── FILM PROJECTS ──
  var filmProjects = [
    { title: 'Two Man',         cover: 'project%20tn/two%20man%20tn.jpg', href: 'project%20pages/two-man.html' },
    { title: 'TVB Music Video', cover: 'project%20tn/tvb%20tn.jpg',       href: 'project%20pages/tvb-music-video.html' },
  ];

  var filmGrid = document.getElementById('filmWorkGrid');

  filmProjects.forEach(function(p) {
    var wrap = document.createElement('div');
    wrap.className = 'card-wrap';

    var coverHtml = p.cover
      ? '<img class="card-img" src="' + p.cover + '" alt="' + p.title + '">'
      : '<span class="card-ghost">' + p.title + '</span>';

    var inner =
      '<div class="card-inner">' +
        coverHtml +
        '<div class="card-fade"></div>' +
      '</div>';

    wrap.innerHTML = '<a class="project-card" href="' + p.href + '" aria-label="View ' + p.title + '">' + inner + '</a>';

    filmGrid.appendChild(wrap);
  });
</script>
</body>
</html>
